# The one pipeline every image in this project is built with.
#
# TERRAFORM-ONLY ARTIFACT. The `x-when` keys below are not Cloud Build syntax; Terraform
# reads them and drops them before it creates the build, so `gcloud builds submit
# --config cloudbuild_files/cloudbuild.yaml` rejects this file. Render it instead with
#     bin/cloudbuild-render.py <workspace> <service>
#
# It carries NO service-specific knowledge: no build args, no image names, no timeouts,
# no framework flags. Everything that differs between services arrives as a substitution
# Terraform computes from settings/<workspace>.yaml (docs/cloudbuild-pipeline.md):
#
#   _IMAGE               Artifact Registry path of the image, fully resolved
#   _BUILD_ARGS          every `--build-arg K='v'` from cloudbuild.build_args, quoted
#   _DOCKER_TARGET       `--target=<stage>` from cloudbuild.docker_target, else empty
#   _DOCKERFILE_PATH     cloudbuild.dockerfile_path
#   _BUILD_CONTEXT_PATH  cloudbuild.build_context_path
#   _PREFIXED_NAME       the Cloud Run service to deploy
#   _DEPLOY_REGION       where that service lives, NOT always the project's region
#   _JOB_NAME            the Cloud Run job to update
#   _JOB_REGION          where that job lives
#   _BINAUTH_ATTESTOR    the attestor that signs the pushed digest, only with
#                        binary_authorization.enabled
#   _BINAUTH_KMS_KEY_VERSION  the KMS key version it signs with, same condition
#
# `x-when: [flag]` keeps a step only when every listed capability is on for that service
# (local.cloudbuild_capabilities in gcp.cloudbuild.tf). Terraform rewrites the `waitFor`
# of the steps that survive, so dropping a step never leaves a dangling dependency. A
# flag that is not a real capability is a plan error, never a step that silently stops
# running.
#
# Mind the dollars: Cloud Build reads `$WORD` anywhere in this file (comments included)
# as a substitution. Shell variables here are lowercase, and a literal dollar for the
# shell is written `$$`.
steps:
  # Only for images that install private packages from this project's Artifact Registry.
  # Off by default: an undeclared --build-arg is dropped by docker, so passing a token to
  # an image that never asked for one only lengthens the build and puts a credential one
  # `docker history` away.
  - id: "ar-token"
    x-when: ["ar_token"]
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - "gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/cloud-platform > /workspace/access_token.txt"

  # Source scans. Off until cloudbuild.scan says otherwise. A blocking flag
  # wins over the report-only flag of the same scanner. Images are pinned.
  - id: "scan-secrets"
    x-when: ["scan_secrets"]
    name: "ghcr.io/gitleaks/gitleaks:v8.30.1"
    args: ["detect", "--source", "${_BUILD_CONTEXT_PATH}", "--no-git", "--redact", "--exit-code", "0"]
    allowFailure: true
  - id: "scan-secrets-blocking"
    x-when: ["scan_secrets_blocking"]
    name: "ghcr.io/gitleaks/gitleaks:v8.30.1"
    args: ["detect", "--source", "${_BUILD_CONTEXT_PATH}", "--no-git", "--redact", "--exit-code", "1"]
  - id: "scan-sast"
    x-when: ["scan_sast"]
    name: "ghcr.io/semgrep/semgrep:1.184.0"
    args: ["scan", "--config", "p/default", "--metrics", "off", "${_BUILD_CONTEXT_PATH}"]
    allowFailure: true
  - id: "scan-sast-blocking"
    x-when: ["scan_sast_blocking"]
    name: "ghcr.io/semgrep/semgrep:1.184.0"
    args: ["scan", "--config", "p/default", "--error", "--metrics", "off", "${_BUILD_CONTEXT_PATH}"]
  - id: "scan-deps"
    x-when: ["scan_deps"]
    name: "ghcr.io/aquasecurity/trivy:0.76.2"
    args: ["fs", "--severity", "HIGH,CRITICAL", "--exit-code", "0", "--no-progress", "${_BUILD_CONTEXT_PATH}"]
    allowFailure: true
  - id: "scan-deps-blocking"
    x-when: ["scan_deps_blocking"]
    name: "ghcr.io/aquasecurity/trivy:0.76.2"
    args: ["fs", "--severity", "HIGH,CRITICAL", "--exit-code", "1", "--no-progress", "${_BUILD_CONTEXT_PATH}"]

  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    waitFor: ["ar-token", "scan-secrets", "scan-secrets-blocking", "scan-sast", "scan-sast-blocking", "scan-deps", "scan-deps-blocking"]
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        set -e
        docker build \
          -f ${_DOCKERFILE_PATH} \
          ${_DOCKER_TARGET} \
          ${_BUILD_ARGS} \
          -t ${_IMAGE}:${SHORT_SHA} \
          -t ${_IMAGE}:latest \
          ${_BUILD_CONTEXT_PATH}

  - id: "push"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["build"]
    args:
      - "push"
      - "${_IMAGE}"
      - "--all-tags"

  # Binary Authorization only admits a digest the attestor has signed, so the image is
  # signed before anything deploys it. Signing the digest, not the tag: a tag can move.
  - id: "sign-image"
    x-when: ["sign_image"]
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    waitFor: ["push"]
    args:
      - "-c"
      - |
        set -euo pipefail
        digest="$$(gcloud artifacts docker images describe ${_IMAGE}:${SHORT_SHA} --format='value(image_summary.digest)')"
        gcloud beta container binauthz attestations sign-and-create \
          --artifact-url="${_IMAGE}@$${digest}" \
          --attestor="${_BINAUTH_ATTESTOR}" \
          --keyversion="${_BINAUTH_KMS_KEY_VERSION}"

  - id: "deploy-service"
    x-when: ["deploy_service"]
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "gcloud"
    waitFor: ["push", "sign-image"]
    args:
      - "run"
      - "deploy"
      - "${_PREFIXED_NAME}"
      - "--image"
      - "${_IMAGE}:${SHORT_SHA}"
      - "--region"
      - "${_DEPLOY_REGION}"
      - "--platform"
      - "managed"
      - "--quiet"

  # The build of a Cloud Run job: the job IS the deliverable, so a failure here is the
  # build's failure.
  - id: "deploy-job"
    x-when: ["deploy_job"]
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "gcloud"
    waitFor: ["push", "sign-image"]
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--image"
      - "${_IMAGE}:${SHORT_SHA}"
      - "--region"
      - "${_JOB_REGION}"
      - "--quiet"

  # A job that shares a service's image (cloudbuild.job_name). Cloud Run pins the digest
  # at deploy time, so without this the job would keep running the digest it was created
  # with, forever. allowFailure because the service is the deliverable here and the job
  # may not exist yet on the first build.
  - id: "update-companion-job"
    x-when: ["update_companion_job"]
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "gcloud"
    waitFor: ["push", "sign-image"]
    allowFailure: true
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--image"
      - "${_IMAGE}:${SHORT_SHA}"
      - "--region"
      - "${_JOB_REGION}"
      - "--quiet"

options:
  logging: CLOUD_LOGGING_ONLY

# Default only. Per service: cloudbuild.build_timeout in settings/<workspace>.yaml.
timeout: "1800s"
