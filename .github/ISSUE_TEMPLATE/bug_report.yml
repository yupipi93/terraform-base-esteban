name: Bug report
description: Terraform, a settings key, a script or a doc does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, state files, real project ids, billing account ids or email addresses.
        A vulnerability goes to a private security advisory, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran and what you got, with the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour you expected, and the doc or settings comment that describes it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal settings/<workspace>.yaml (placeholders only) and the commands.
      render: yaml
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terraform root files
        - A vendored module
        - Settings or schema
        - Cloud Build pipeline
        - Scripts under bin/
        - CI or tests
        - Docs
    validations:
      required: true
  - type: input
    id: workspace
    attributes:
      label: Workspace shape
      description: dev, stg, pro, the default workspace or your own.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of terraform version, and the commit of this repository.
    validations:
      required: true
