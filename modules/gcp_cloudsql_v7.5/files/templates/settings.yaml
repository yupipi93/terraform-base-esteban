# Settings definition, modify accordingly and add this to data block your settings/env.yaml
# All this options are optional, but if not added to settings, then must be removed from the module resource definition
app:
  sql:
    version: "MYSQL_8_0"
    tier: "db-f1-micro"
    availability: "ZONAL"  # ZONAL no HA | REGIONAL HA
    ipv4_enabled: true
    ssl_mode: "ENCRYPTED_ONLY" # ALLOW_UNENCRYPTED_AND_ENCRYPTED | ENCRYPTED_ONLY | TRUSTED_CLIENT_CERTIFICATE_REQUIRED
    binary_log_enabled: true
    allowed_networks:
      - name: "Look at this"
        value: "34.76.152.15/32"
      - value: "192.168.2.2/32"
    disk:
      type: "PD_SSD"       # PD_HDD | PD_SSD
      size: 10
    replica: 0
    deletion_protection: true
    flags:
      max_connections: 200
    special_password: 
      enabled: true
      characters: "@#~"    
    backup:
      start_time: "08:00"
      retained_backups: 7
      location: "eu"
      point_in_time_recovery_enabled: true   # MySQL: binary log, PostgreSQL: WAL. Omit to follow binary_log_enabled on MySQL
      transaction_log_retention_days: 7      # 1-7 on ENTERPRISE, 1-35 on ENTERPRISE_PLUS
    maintenance:
      day: 2
      hour: 7
    deny_maintenance_period:
      start_date: "2025-2-26"
        end_date: "2025-5-26"
        time: "23:59:00"
    # All the monitoring entries are optional. The shown below are the default options used
    monitoring:
      cpu:
        duration: "1800s"
        threshold_value: 0.85
        alignment_period: "900s"
    memory:
      duration: "300s"
      threshold_value: 0.85
      limit_ram: null
      alignment_period: "900s"
    connections:
      duration: "120s"
      threshold_value: 0.85
      max_connections: null # This entry will replace the max_connections flag as connections number limit
      alignment_period: "60s"
    disk_space:
      duration: "600s"
      threshold_value: 0.85
      alignment_period: "300s"
    disk_iops:
      duration: "1800s"
      threshold_value: 0.85
      alignment_period: "60s"
    log_entries:
      duration: "60s"
      threshold_value: 0
      alignment_period: "60s"
