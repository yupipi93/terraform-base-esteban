# Optional, values to custom the alerts policies
# Each severity is the default value.
monitoring:
  lb:
    request_count:
      duration: "180s"
      threshold_value: -1
      alignment_period: "600s"
      severity: "WARNING"
      enabled: true
    latency:
      duration: "300s"
      threshold_value: 3000
      alignment_period: "60s"
      severity: "WARNING"
      enabled: true
    status_403_cloud_armor:
      duration: "180s"
      threshold_value: 150
      alignment_period: "60s"
      severity: "WARNING"
      enabled: true
    status_403_backends:
      duration: "180s"
      threshold_value: 25
      alignment_period: "60s"
      severity: "WARNING"
      enabled: true
    status_404_backends:
      duration: "180s"
      threshold_value: 150
      alignment_period: "60s"
      severity: "WARNING"
      enabled: true
    status_4xx_backends:
      duration: "180s"
      threshold_value: 100
      alignment_period: "60s"
      severity: "ERROR"
      enabled: true
    status_5xx_backends:
      duration: "180s"
      threshold_value: 25
      alignment_period: "60s"
      severity: "ERROR"
      enabled: true
