# ===================================================================
# DEFAULT SETTINGS, shared by every workspace
# ===================================================================
# Each workspace file (settings/<workspace>.yaml) is merged on top of this one.
# Keep here only what every project of yours shares; override the rest per workspace.

# Placeholders so `terraform validate` works on the default workspace. That is
# the workspace CI checks. A real environment is settings/dev.yaml,
# settings/stg.yaml or settings/pro.yaml, and those files replace these maps.
# Replace them before any plan of the default workspace.
project:
  id: "my-project-id"
  name: "my-project"
  # The all-zero placeholder, or no number at all, reads the real one from
  # project.id at plan time (gcp.project.tf).
  number: "000000000000"

security:
  alerts_email: "alerts@example.com"

# System/monitoring project: the shared ops project in the `common` folder, which
# also holds the Terraform state bucket (see AGENTS.md). Replace the placeholders
# before the first plan.
project_sys:
  id: "my-system-project-id" #Mandatory parameter
  name: "my-system-project" #Mandatory parameter
  number: "000000000000" #Mandatory parameter
region_name: europe-west1
zones_name:
  - europe-west1-b
# Short prefix for every resource name: "<client.name>-<resource>".
client:
  name: "app"
iac:
  repo: "terraform-base"
# Default empty app.service structure - override in environment files
app:
  service: {}
# Base APIs, enabled in every workspace whatever its sections. A feature's own
# APIs (Cloud SQL, Redis, Firestore, Pub/Sub, IAP, DNS, KMS...) are turned on by
# local.feature_apis in gcp.enabled.apis.tf when its section exists. An API that
# nothing here knows about goes in `extra-apis` of the workspace file, never in
# an `active-apis` copy there (the settings merge is shallow).
active-apis:
  # Project, IAM and impersonation
  - "cloudresourcemanager.googleapis.com"
  - "iam.googleapis.com"
  - "iamcredentials.googleapis.com"

  # The security baseline module always sets the OS Login project metadata,
  # which is a Compute Engine call. Enabling the API alone costs nothing.
  - "compute.googleapis.com"

  # Build and run
  - "cloudbuild.googleapis.com"
  - "run.googleapis.com"
  - "artifactregistry.googleapis.com"
  - "storage.googleapis.com"
  - "secretmanager.googleapis.com"

  # Logging and alerting of the security baseline
  - "logging.googleapis.com"
  - "monitoring.googleapis.com"
